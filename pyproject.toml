[project]
name = "usis"
version = "0.0.1"
description = "USIS — a physics-grounded, uncertainty-aware research instrument for optical spectroscopy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Luca" }]
dependencies = [
    "numpy>=1.26",
    # CIF 1.1/2.0 parsing for the Raman Open Database loader. See PROJECT_DECISIONS.md D8.
    "gemmi>=0.6",
    # Config loading, merging and interpolation. Hydra's own config layer, so promoting to full
    # Hydra at M2 is additive rather than a rewrite. See PROJECT_DECISIONS.md D10.
    "omegaconf>=2.3",
]

[project.optional-dependencies]
# Installed on demand, milestone by milestone. Nothing here is in the M0 critical path.
sci = ["scipy>=1.11", "scikit-learn>=1.4", "pandas>=2.1", "pyarrow>=15"]
ml = ["torch>=2.2"]
chem = ["rdkit>=2023.9", "ase>=3.22"]
# Hydra adds config *groups*, CLI overrides and multirun. Needed when `usis compare`
# composes method x dataset x split at M2; not before.
config = ["hydra-core>=1.3"]
track = ["mlflow>=2.10"]
# RamanBench access layer. ~20 transitive dependencies, so it stays optional and is imported
# lazily; the catalogue snapshot in usis/data/sources/data/ keeps the manifest working without it.
bench = ["raman-data>=1.6"]

[project.scripts]
usis = "usis.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The catalogue snapshot under usis/data/sources/data/ ships automatically: hatchling includes
# every file under a declared package, not only the .py ones. A force-include here would add it
# twice and fail the build.
packages = ["usis"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown is documentation, not source. Ruff will otherwise reformat the Python blocks inside
# the brief and the knowledge notes, which silently rewrites the project's source of truth.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "D"]
ignore = [
    "D107",  # __init__ docstring: covered by the class docstring
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: excluded from the default fast suite"]

[tool.mypy]
# No python_version pin: numpy's shipped stubs use 3.12+ syntax, so mypy must run under the
# interpreter that resolved the environment. CI pins the interpreter instead.
strict = true
warn_unreachable = true
disallow_any_generics = true
files = [
    "usis/chemometrics",
    "usis/compare",
    "usis/core",
    "usis/data",
    "usis/eval",
    "usis/cli",
    "usis/measurement",
    "usis/methods",
    "usis/preprocess",
]

[[tool.mypy.overrides]]
# Optional dependencies probed at runtime by usis.core.provenance. They are absent from the M0
# environment on purpose; the code handles their absence explicitly.
module = ["torch.*", "scipy.*", "sklearn.*", "rdkit.*", "raman_data.*"]
ignore_missing_imports = true
